version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: campusfix_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Persistent named volume for PostgreSQL data
      - campusfix_pgdata:/var/lib/postgresql/data
      # Mount initialization script to automatically enable pgvector
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  campusfix_pgdata:
    name: campusfix_pgdata

